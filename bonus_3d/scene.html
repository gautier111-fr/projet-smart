<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- BONUS (hors programme) : mise en scène 3D des tournées. Aucun calcul de tournée ici. -->
<style>
  :root { --fond: rgba(12, 18, 26, .72); --bord: rgba(255, 255, 255, .14); --or: #ffd23f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
               font-family: "Segoe UI", system-ui, sans-serif; color: #f2f5f7; }
  #scene { position: absolute; inset: 0; }
  .panneau { position: absolute; background: var(--fond); border: 1px solid var(--bord); border-radius: 12px;
             backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0, 0, 0, .35); font-size: 13px;
             transition: opacity .5s; }
  #horloge { top: 12px; left: 12px; padding: 10px 14px; width: 232px; }
  #titre { font-size: 12px; opacity: .75; }
  #heure { font-size: 30px; font-weight: 700; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .barre { height: 6px; background: rgba(255, 255, 255, .15); border-radius: 3px; overflow: hidden; }
  .barre > div { height: 100%; width: 0; background: var(--or); }
  #compteur { margin-top: 8px; }
  #badges { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; display: none; }
  #commandes { top: 12px; right: 12px; padding: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
               max-width: 560px; justify-content: flex-end; z-index: 8; }
  button, select { background: rgba(255, 255, 255, .1); color: #f2f5f7; border: 1px solid rgba(255, 255, 255, .2);
                   border-radius: 7px; padding: 5px 9px; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover, select:hover { background: rgba(255, 255, 255, .2); }
  button.actif { background: var(--or); color: #111; border-color: var(--or); }
  select option { background: #1b2430; }
  #camions { top: 168px; left: 12px; width: 232px; bottom: 70px; overflow-y: auto; padding: 6px; }
  .camion { padding: 6px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .camion:hover, .camion.suivi { background: rgba(255, 255, 255, .12); }
  .camion .ligne1 { display: flex; justify-content: space-between; font-weight: 600; }
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .camion .etat { opacity: .8; font-size: 12px; margin: 2px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #journal { right: 12px; bottom: 70px; width: 300px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  #journal b { font-size: 13px; }
  #frise { left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
  #frise input { flex: 1; accent-color: var(--or); }
  #infobulle { position: absolute; pointer-events: none; display: none; background: rgba(255, 255, 255, .96);
               color: #111; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45;
               box-shadow: 0 3px 12px rgba(0, 0, 0, .3); max-width: 260px; z-index: 9; }
  #aide { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; font-size: 11px; opacity: .75;
          text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #message { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: var(--fond);
             padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 9; }
  /* Tableau de bord : GPS et compteur de vitesse, quand on suit un camion */
  #bord { position: absolute; right: 12px; bottom: 70px; display: none; gap: 10px; align-items: flex-end; }
  #bord .panneau { position: relative; padding: 8px; }
  body.suivi #bord { display: flex; }
  body.suivi #journal { display: none; }
  #gpsTexte { width: 250px; font-size: 12px; line-height: 1.45; margin-top: 6px; }
  #gpsTexte .grand { font-size: 15px; font-weight: 700; }
  /* Mode cinéma : bandes noires, panneaux masqués */
  .bande { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .7s; z-index: 5; }
  #bandeHaut { top: 0; } #bandeBas { bottom: 0; }
  body.cinema .bande { height: 10%; }
  body.cinema .panneau:not(#commandes), body.cinema #aide, body.cinema #bord { opacity: 0; pointer-events: none; }
  body.cinema #commandes { opacity: .25; } body.cinema #commandes:hover { opacity: 1; }
  #legende { position: absolute; left: 5%; bottom: 13%; z-index: 6; opacity: 0; transition: opacity .8s;
             text-shadow: 0 2px 10px #000; }
  #legende .l1 { font-size: 26px; font-weight: 600; } #legende .l2 { font-size: 16px; opacity: .85; }
  body.cinema #legende { opacity: 1; }
  #fondu { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 7; }
  body.cabine #aide { display: none; }
</style>

<body>
<div id="scene"></div>
<div class="bande" id="bandeHaut"></div><div class="bande" id="bandeBas"></div>
<div id="legende"><div class="l1"></div><div class="l2"></div></div>
<div id="fondu"></div>
<div id="horloge" class="panneau">
  <div id="titre"></div>
  <div id="heure"></div>
  <div class="barre"><div id="barreJour"></div></div>
  <div id="compteur"></div>
  <div id="badges"><span id="trafic" class="badge"></span><span id="meteo" class="badge"></span></div>
</div>
<div id="commandes" class="panneau">
  <button id="lecture" title="Lecture / pause">⏸</button>
  <span id="vitesses"></span>
  <select id="vue" title="Caméra"></select>
  <button id="cabine" title="Vue depuis le siège du conducteur">🎥 Cabine</button>
  <button id="cinema" title="La caméra filme toute seule">🎬 Cinéma</button>
  <button id="pluie" title="Météo">🌧️ Pluie</button>
  <button id="son" title="Son du moteur et de la ville">🔇 Son</button>
  <button id="tournees" class="actif" title="Afficher le trajet de chaque camion">Tournées</button>
  <select id="qualite" title="Qualité de l'image"><option value="2">Qualité haute</option><option value="1">Qualité moyenne</option><option value="0">Qualité basse</option></select>
  <button id="ecran" title="Plein écran">⛶</button>
</div>

<div id="bord">
  <div class="panneau"><canvas id="vitesse" width="380" height="250" style="width:190px;height:125px"></canvas></div>
  <div class="panneau"><canvas id="gps" width="500" height="360" style="width:250px;height:180px;border-radius:8px"></canvas><div id="gpsTexte"></div></div>
</div>
<div id="frise" class="panneau"><span id="debutFrise"></span><input id="temps" type="range" min="0" max="1000" value="0"><span id="finFrise"></span></div>
<div id="aide">Clic gauche : tourner · clic droit : déplacer · molette : zoom · clic sur un camion : le suivre · survol : détails</div>
<div id="message"></div>
<div id="infobulle"></div>

<script>/*THREE*/</script>
<script>
"use strict";
const D = __DONNEES__;

// =====================================================================
// 1. Outils
// =====================================================================
function alea(graine) {                       // hasard reproductible : la ville est toujours la même
  return function () {
    graine |= 0; graine = graine + 0x6D2B79F5 | 0;
    let t = Math.imul(graine ^ graine >>> 15, 1 | graine);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = alea(2026);
const entre = (a, b) => a + (b - a) * rnd();
const choisir = liste => liste[Math.floor(rnd() * liste.length)];
const borne = (v, a, b) => Math.max(a, Math.min(b, v));
const deux = v => String(Math.floor(v)).padStart(2, "0");
const virgule = v => String(v).replace(".", ",");

function heureTexte(t) {                      // même affichage que le suivi 2D
  if (D.lorraine) return `${Math.floor(t / 60)}h${deux(t % 60)}`;
  return `${(100 * (t - D.ouverture) / (D.fermeture - D.ouverture)).toFixed(1)} %`;
}
function heureLumiere(t) {                    // heure « solaire » pour le ciel et l'éclairage
  if (D.lorraine) return t / 60;
  return 7 + 11 * borne((t - D.ouverture) / (D.fermeture - D.ouverture), 0, 1);   // de 7h au crépuscule
}
function coefTrafic(t) {
  if (!D.trafic) return { coef: 1, nom: "" };
  const p = 100 * t / D.horizon;
  for (const tr of D.trafic) if (tr.debut <= p && p < tr.fin) return { coef: tr.coef, nom: tr.tranche };
  return { coef: 1, nom: "Circulation fluide" };
}
function toile(l, h, dessin, repeter) {       // texture dessinée sur un canvas
  const c = document.createElement("canvas"); c.width = l; c.height = h;
  dessin(c.getContext("2d"), l, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  if (repeter) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function grain(g, l, h, n, couleurs, taille) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = couleurs[Math.floor(rnd() * couleurs.length)];
    const s = taille * entre(.5, 1.6); g.fillRect(rnd() * l, rnd() * h, s, s);
  }
}
function etiquette(texte, fond, couleur, taille) {   // texte toujours face à la caméra
  const t = toile(512, 128, (g, l) => {
    g.font = "bold 54px Segoe UI, sans-serif";
    const w = Math.min(l - 8, g.measureText(texte).width + 44);
    g.fillStyle = fond; g.beginPath();
    g.roundRect ? g.roundRect((l - w) / 2, 18, w, 92, 40) : g.rect((l - w) / 2, 18, w, 92);
    g.fill();
    g.fillStyle = couleur; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(texte, l / 2, 66);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true, sizeAttenuation: false }));
  s.scale.set(0.16 * taille, 0.04 * taille, 1); s.renderOrder = 10;
  return s;
}
// Halo lumineux (phares, lampadaires, projecteurs)
const texHalo = toile(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.2, "rgba(255,255,255,.55)");
  r.addColorStop(.5, "rgba(255,255,255,.12)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});
function halo(couleur, taille) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texHalo, color: couleur, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity: 0 }));
  s.scale.set(taille, taille, 1);
  return s;
}
const m4 = new THREE.Matrix4(), m4b = new THREE.Matrix4(), mLocal = new THREE.Matrix4();
const q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), e3 = new THREE.Vector3(), eul = new THREE.Euler();
const HAUT = new THREE.Vector3(0, 1, 0);
function placer(mesh, i, x, y, z, angle, sx, sy, sz) {
  q4.setFromAxisAngle(HAUT, angle || 0);
  mesh.setMatrixAt(i, m4.compose(v3.set(x, y, z), q4, e3.set(sx, sy, sz)));
}
function repere(x, z, angle) {               // matrice d'un bâtiment (pour y accrocher stores, cheminées…)
  return new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion().setFromAxisAngle(HAUT, angle), new THREE.Vector3(1, 1, 1));
}
function placerDans(mesh, i, base, lx, ly, lz, rx, ry, sx, sy, sz) {
  mLocal.compose(v3.set(lx, ly, lz), q4.setFromEuler(eul.set(rx || 0, ry || 0, 0)), e3.set(sx, sy, sz));
  mesh.setMatrixAt(i, m4b.multiplyMatrices(base, mLocal));
}

// =====================================================================
// 2. Données : lieux, tronçons, arrêts
// =====================================================================
const L = D.lieux, NB = L.length;
let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
for (const p of L) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
const TAILLE = Math.max(maxX - minX, maxZ - minZ) + 160;
const T0 = Math.min(...D.camions.map(c => c.depart)), T1 = Math.max(...D.camions.map(c => c.retour));
const SIMPLE = D.camions.length > 40;         // beaucoup de camions : modèles allégés
const LARGEUR_ROUTE = 3.8;
const depot = L[0];
const cotesParking = Math.ceil(Math.sqrt(D.camions.length));

const infoClient = new Array(NB).fill(null);
D.camions.forEach((c, k) => c.arrets.forEach(a => { infoClient[a.client] = { camion: k, ...a }; }));

const troncons = [];
D.camions.forEach((c, k) => {
  const chemin = [0, ...c.arrets.map(a => a.client), 0];
  for (let i = 0; i + 1 < chemin.length; i++) troncons.push({ a: chemin[i], b: chemin[i + 1], camion: k });
});
const segRoutes = troncons.map(t => ({ x1: L[t.a].x, z1: L[t.a].z, x2: L[t.b].x, z2: L[t.b].z, a: t.a, b: t.b }));

function directionLibre(i) {                  // le plus grand angle sans route : on y pose le bâtiment
  const angles = [];
  for (const t of troncons) {
    const j = t.a === i ? t.b : t.b === i ? t.a : -1;
    if (j >= 0 && j !== i) angles.push(Math.atan2(L[j].z - L[i].z, L[j].x - L[i].x));
  }
  if (!angles.length) return rnd() * Math.PI * 2;
  angles.sort((a, b) => a - b);
  let meilleur = 0, milieu = angles[0] + Math.PI;
  for (let k = 0; k < angles.length; k++) {
    const a = angles[k], b = k + 1 < angles.length ? angles[k + 1] : angles[0] + 2 * Math.PI;
    if (b - a > meilleur) { meilleur = b - a; milieu = (a + b) / 2; }
  }
  return milieu;
}
const angleLibre = L.map((_, i) => directionLibre(i));
// Le camion se gare au bord de la route, du côté du commerce
const arretDe = L.map((p, i) => ({ x: p.x + Math.cos(angleLibre[i]) * 1.6, z: p.z + Math.sin(angleLibre[i]) * 1.6 }));

// =====================================================================
// 3. Moteur 3D : rendu, caméra, ciel physique, lumières
// =====================================================================
const conteneur = document.getElementById("scene");
const rendu = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
rendu.outputEncoding = THREE.sRGBEncoding;
rendu.toneMapping = THREE.ACESFilmicToneMapping;
rendu.toneMappingExposure = .45;
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
conteneur.appendChild(rendu.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.3, TAILLE * 14);
const controles = new THREE.OrbitControls(camera, rendu.domElement);
controles.enableDamping = true;
controles.maxPolarAngle = Math.PI * 0.485;
controles.minDistance = 5;
controles.maxDistance = TAILLE * 3;

let qualite = 2;
function redimensionner() {
  const l = conteneur.clientWidth || window.innerWidth, h = conteneur.clientHeight || window.innerHeight;
  rendu.setPixelRatio(qualite === 2 ? Math.min(window.devicePixelRatio, 2) : qualite === 1 ? 1 : .75);
  rendu.setSize(l, h); camera.aspect = l / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", redimensionner);
new ResizeObserver(redimensionner).observe(conteneur);
redimensionner();

// Ciel physique (diffusion de la lumière dans l'atmosphère)
const ciel = new THREE.Sky();
ciel.scale.setScalar(TAILLE * 7);
scene.add(ciel);
const U = ciel.material.uniforms;
U.mieCoefficient.value = .005; U.mieDirectionalG.value = .8;
// Le même ciel, dans une petite scène, sert aux reflets (vitres, carrosseries)
const sceneReflets = new THREE.Scene(), cielReflets = new THREE.Sky();
cielReflets.scale.setScalar(1000); cielReflets.material.uniforms = U; sceneReflets.add(cielReflets);
const pmrem = new THREE.PMREMGenerator(rendu);
let refletsRT = null, heureReflets = -99, pluieReflets = null;
function majReflets() {
  const rt = pmrem.fromScene(sceneReflets, 0, 0.1, 5000);
  if (refletsRT) refletsRT.dispose();
  refletsRT = rt; scene.environment = rt.texture;
}

const hemi = new THREE.HemisphereLight(0xdbeaff, 0x4a5638, .8);
scene.add(hemi);
const soleil = new THREE.DirectionalLight(0xfff0dd, 2.6);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.bias = -0.0004; soleil.shadow.normalBias = .05;
scene.add(soleil, soleil.target);
const lune = new THREE.DirectionalLight(0x9db4ff, 0);
scene.add(lune, lune.target);
scene.fog = new THREE.Fog(0xcfdde8, TAILLE * 1.2, TAILLE * 4);

// Étoiles
const etoiles = (() => {
  const n = 1800, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, h = Math.asin(entre(.05, 1)), r = TAILLE * 5;
    p.set([Math.cos(a) * Math.cos(h) * r, Math.sin(h) * r, Math.sin(a) * Math.cos(h) * r], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
})();
scene.add(etoiles);
const halosLune = halo(0xdfe8ff, TAILLE * .25); halosLune.material.fog = false; scene.add(halosLune);

// =====================================================================
// 4. Le sol, les trottoirs, les routes, les lampadaires
// =====================================================================
const texHerbe = toile(512, 512, (g, l, h) => {
  g.fillStyle = "#557a3c"; g.fillRect(0, 0, l, h);
  for (let i = 0; i < 40; i++) {                                   // grandes taches
    g.fillStyle = choisir(["rgba(90,120,55,.35)", "rgba(70,100,45,.35)", "rgba(120,140,70,.25)"]);
    g.beginPath(); g.ellipse(rnd() * l, rnd() * h, entre(20, 70), entre(20, 70), rnd() * 3, 0, 7); g.fill();
  }
  grain(g, l, h, 26000, ["rgba(40,70,30,.4)", "rgba(140,165,85,.35)", "rgba(95,125,60,.4)"], 2);
}, true);
texHerbe.repeat.set(TAILLE * 4 / 40, TAILLE * 4 / 40);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(TAILLE * 4, TAILLE * 4),
  new THREE.MeshStandardMaterial({ map: texHerbe, roughness: 1 }));
sol.rotation.x = -Math.PI / 2; sol.receiveShadow = true;
scene.add(sol);

// Bande plate le long de segments, en une seule géométrie
function ruban(segments, largeur, y, couleurs, pasV) {
  const pos = [], uv = [], col = [], idx = [];
  segments.forEach((s, k) => {
    const dx = s.x2 - s.x1, dz = s.z2 - s.z1, lg = Math.hypot(dx, dz) || 1e-6;
    const ux = dx / lg, uz = dz / lg, nx = -uz * largeur / 2, nz = ux * largeur / 2;
    const e = largeur / 2, yy = y + (k % 5) * 0.002;
    const ax = s.x1 - ux * e, az = s.z1 - uz * e, bx = s.x2 + ux * e, bz = s.z2 + uz * e;
    const base = pos.length / 3;
    pos.push(ax - nx, yy, az - nz, ax + nx, yy, az + nz, bx - nx, yy, bz - nz, bx + nx, yy, bz + nz);
    const v = (lg + 2 * e) / (pasV || 8);
    uv.push(0, 0, 1, 0, 0, v, 1, v);
    if (couleurs) { const c = couleurs[k]; for (let i = 0; i < 4; i++) col.push(c.r, c.g, c.b); }
    idx.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  if (couleurs) g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// Trottoirs (dalles)
const texTrottoir = toile(64, 64, (g, l, h) => {
  g.fillStyle = "#bdb8ad"; g.fillRect(0, 0, l, h);
  grain(g, l, h, 900, ["rgba(0,0,0,.08)", "rgba(255,255,255,.12)"], 1.5);
  g.fillStyle = "rgba(60,55,50,.35)"; for (let k = 0; k < 4; k++) { g.fillRect(k * 16, 0, 1, h); g.fillRect(0, k * 16, l, 1); }
}, true);
const trottoirs = new THREE.Mesh(ruban(segRoutes, LARGEUR_ROUTE + 3.4, 0.02, null, 2),
  new THREE.MeshStandardMaterial({ map: texTrottoir, roughness: .95 }));
trottoirs.receiveShadow = true; scene.add(trottoirs);
// Asphalte avec marquage
const texRoute = toile(128, 512, (g, l, h) => {
  g.fillStyle = "#3b3f45"; g.fillRect(0, 0, l, h);
  grain(g, l, h, 9000, ["rgba(0,0,0,.28)", "rgba(255,255,255,.06)", "rgba(25,25,30,.3)", "rgba(90,90,95,.25)"], 1.6);
  g.fillStyle = "rgba(0,0,0,.16)"; g.fillRect(l * .2, 0, l * .1, h); g.fillRect(l * .7, 0, l * .1, h);  // traces des roues
  for (let k = 0; k < 5; k++) { g.fillStyle = "rgba(0,0,0,.12)"; g.beginPath(); g.ellipse(rnd() * l, rnd() * h, entre(5, 18), entre(10, 40), 0, 0, 7); g.fill(); }
  g.fillStyle = "#e9e9e6"; g.fillRect(6, 0, 4, h); g.fillRect(l - 10, 0, 4, h);
  g.fillStyle = "#f3f3f0"; g.fillRect(l / 2 - 2, 0, 4, h * .5);

function facade(etages, colonnes, style) {
  const l = 256, he = 64, h = he * etages, cases = [];
  for (let e = 0; e < etages; e++) for (let c = 0; c < colonnes; c++)
    cases.push({ c, e, allume: rnd() < .4, teinte: choisir(["#ffd38a", "#ffe6b3", "#ffc56e", "#cfe0ff"]), rideau: rnd() < .45 });
  const lc = l / colonnes;
  const verre = style === "verre", rdc = style === "commerce";
  const jour = toile(l, h, g => {
    if (verre) {
      g.fillStyle = "#cfd6dd"; g.fillRect(0, 0, l, h);
      for (const k of cases) {
        const x = k.c * lc + 3, y = k.e * he + 3, gr = g.createLinearGradient(0, y, 0, y + he - 6);
        gr.addColorStop(0, "#5f7d99"); gr.addColorStop(1, "#22364c");
        g.fillStyle = gr; g.fillRect(x, y, lc - 6, he - 6);
      }
      return;
    }
    g.fillStyle = "#efefec"; g.fillRect(0, 0, l, h);
    grain(g, l, h, 1500 * etages / 2, ["rgba(0,0,0,.05)", "rgba(255,255,255,.12)"], 2);
    for (let e = 1; e < etages; e++) { g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(0, e * he - 3, l, 3); }
    for (const k of cases) {
      if (rdc && k.e === etages - 1) continue;                   // rez-de-chaussée : vitrine
      const x = k.c * lc + lc * .2, y = k.e * he + 12, w = lc * .6, hh = he * .55;
      g.fillStyle = "#fafafa"; g.fillRect(x - 3, y - 3, w + 6, hh + 6);   // encadrement
      const gr = g.createLinearGradient(0, y, 0, y + hh);
      gr.addColorStop(0, "#7d93a8"); gr.addColorStop(.5, "#2d3b4b"); gr.addColorStop(1, "#1d2733");
      g.fillStyle = gr; g.fillRect(x, y, w, hh);
      if (k.rideau) { g.fillStyle = "rgba(235,225,205,.75)"; g.fillRect(x, y, w * .28, hh); g.fillRect(x + w * .72, y, w * .28, hh); }
      g.fillStyle = "#f2f2f2"; g.fillRect(x + w / 2 - 1, y, 2, hh);
      g.fillStyle = "#d9d6cf"; g.fillRect(x - 5, y + hh + 2, w + 10, 5);            // appui
    }
    if (rdc) {
      const y = (etages - 1) * he + 8;
      const gr = g.createLinearGradient(0, y, 0, h);
      gr.addColorStop(0, "#9fb4c6"); gr.addColorStop(1, "#24313f");
      g.fillStyle = "#3b3f45"; g.fillRect(8, y - 4, l - 16, h - y);
      g.fillStyle = gr; g.fillRect(14, y, l * .62, h - y - 4);
      g.fillStyle = "#6b4a33"; g.fillRect(l * .7, y, l * .2, h - y);              // porte
      g.fillStyle = "#c9a227"; g.fillRect(l * .87, y + (h - y) / 2, 4, 8);
    }
  });
  const nuit = toile(l, h, g => {
    g.fillStyle = "#000"; g.fillRect(0, 0, l, h);
    for (const k of cases) {
      if (!k.allume) continue;
      if (rdc && k.e === etages - 1) continue;
      g.fillStyle = k.teinte;
      if (verre) g.fillRect(k.c * lc + 3, k.e * he + 3, lc - 6, he - 6);
      else g.fillRect(k.c * lc + lc * .2, k.e * he + 12, lc * .6, he * .55);
    }
    if (rdc) { g.fillStyle = "#ffe0a8"; g.fillRect(14, (etages - 1) * he + 8, l * .62, he - 12); }
  });
  return new THREE.MeshStandardMaterial({ map: jour, emissiveMap: nuit, emissive: 0xffffff, emissiveIntensity: 0,
    roughness: verre ? .12 : .85, metalness: verre ? .65 : 0 });
}

const fondu = document.getElementById("fondu"), legende = document.getElementById("legende");
let plan = null;
function nouveauPlan() {
  fondu.style.opacity = 1;
  setTimeout(() => {
    const roulent = camions.map((cm, k) => k).filter(k => camions[k].etat.bouge);
    const actifs = roulent.length ? roulent : camions.map((cm, k) => k).filter(k => !camions[k].etat.fini);
    const k = actifs.length ? actifs[Math.floor(Math.random() * actifs.length)] : -1;
    const types = k < 0 ? ["ensemble"] : ["orbite", "poursuite", "bord", "drone", "orbite", "poursuite", "ensemble", "bord"];
    const type = types[Math.floor(Math.random() * types.length)];
    plan = { type, k, debut: performance.now(), angle: Math.random() * Math.PI * 2 };
    if (type === "bord" && k >= 0) {                // sur le trottoir d'en face, là où le camion va livrer
      const P = camions[k].passages, cible = P[Math.min(P.length - 1, Math.max(1, camions[k].etat.prochain || 1))];
      const i = cible.lieu, a = angleLibre[i] + Math.PI, r = LARGEUR_ROUTE / 2 + 5;
      plan.pos = new THREE.Vector3(L[i].x + Math.cos(a) * r, 3.2, L[i].z + Math.sin(a) * r);

}
function filmer(dt) {

  if (ecoule > 9 || (plan.k >= 0 && camions[plan.k].etat.fini)) { plan.debut = performance.now() + 1e6; nouveauPlan(); }
  const l1 = legende.querySelector(".l1"), l2 = legende.querySelector(".l2");
  if (plan.k < 0 || plan.type === "ensemble") {
    plan.angle += dt * .05;
    camera.position.set(Math.sin(plan.angle) * TAILLE * .45, TAILLE * .26, Math.cos(plan.angle) * TAILLE * .45);
    camera.lookAt(0, 0, 0);
    l1.textContent = D.nom; l2.textContent = `${heureTexte(t)} · ${document.getElementById("compteur").textContent.replace("📦 ", "")}`;
    return;

  const cm = camions[plan.k], fx = Math.sin(cm.cap), fz = Math.cos(cm.cap), p = cm.groupe.position;

const compteurVitesse = document.getElementById("vitesse"), ctxV = compteurVitesse.getContext("2d");
function dessinerGps(cm) {
  const W = gps.width, H = gps.height, R = 150, e = 1.5 * W / (2 * R), c = cm.cap, px = cm.x, pz = cm.z;
  const ecran = (x, z) => { const dx = x - px, dz = z - pz; return [W / 2 + (dz * Math.sin(c) - dx * Math.cos(c)) * e, H * .66 - (dx * Math.sin(c) + dz * Math.cos(c)) * e]; };
  ctxGps.fillStyle = "#16212c"; ctxGps.fillRect(0, 0, W, H);
  ctxGps.lineCap = "round";
  for (const [larg, coul] of [[16, "#2c3a48"], [10, "#4a5a6b"]]) {
    ctxGps.strokeStyle = coul; ctxGps.lineWidth = larg; ctxGps.beginPath();
    for (const s of segRoutes) {
      if (distSeg(px, pz, s) > R * 1.6) continue;
      const a = ecran(s.x1, s.z1), b = ecran(s.x2, s.z2); ctxGps.moveTo(a[0], a[1]); ctxGps.lineTo(b[0], b[1]);
    }
    ctxGps.stroke();
  }
  const P = cm.passages, k = Math.max(1, cm.etat.prochain || 1);
  if (cm.etat.prochain >= 0) {
    ctxGps.strokeStyle = cm.donnees.couleur; ctxGps.lineWidth = 9; ctxGps.beginPath();
    let a = ecran(cm.x, cm.z); ctxGps.moveTo(a[0], a[1]);
    for (let i = k; i < P.length; i++) { a = ecran(P[i].x, P[i].z); ctxGps.lineTo(a[0], a[1]); }
    ctxGps.stroke();
  }
  for (let i = 1; i < P.length - 1; i += 2) {                    // arrêts : faits (vert) ou à faire
    const q = ecran(P[i].x, P[i].z), fait = P[i + 1].t <= t, actuel = i === k || i + 1 === k;
    ctxGps.fillStyle = fait ? "#2ecc71" : actuel ? "#ffd23f" : "#ffffff";
    ctxGps.beginPath(); ctxGps.arc(q[0], q[1], actuel ? 11 : 7, 0, 7); ctxGps.fill();
  }
  const dd = ecran(depot.x, depot.z); ctxGps.fillStyle = "#2b6e3f"; ctxGps.fillRect(dd[0] - 10, dd[1] - 10, 20, 20);
  ctxGps.save(); ctxGps.translate(W / 2, H * .66);                // le camion : une flèche
  ctxGps.fillStyle = "#fff"; ctxGps.strokeStyle = cm.donnees.couleur; ctxGps.lineWidth = 5;
  ctxGps.beginPath(); ctxGps.moveTo(0, -20); ctxGps.lineTo(14, 16); ctxGps.lineTo(0, 8); ctxGps.lineTo(-14, 16); ctxGps.closePath(); ctxGps.fill(); ctxGps.stroke();
  ctxGps.restore();
  // Texte : prochaine étape
  const e2 = cm.etat; let html;
  if (e2.fini) html = `<span class="grand">🏁 Tournée terminée</span>`;
  else {
    const prochain = P.slice(Math.max(1, e2.prochain || 1)).find(p => (p.arret || p.lieu === 0) && p.t >= t) || P[P.length - 1];
    const km = (e2.reste || 0) * D.km_par_unite;
    if (prochain.lieu === 0) html = `<span class="grand">🏭 Retour au dépôt</span><br>${e2.bouge ? virgule(km.toFixed(1)) + " km · " : ""}arrivée ${heureTexte(prochain.t)}`;
    else {
      const p = L[prochain.lieu], a = prochain.arret;
      const fen = p.fenetre ? `créneau ${heureTexte(p.fenetre[0])} – ${heureTexte(p.fenetre[1])}` : "sans créneau";
      const attente = a.debut - a.arrivee > 0.5 ? ` · attente ${D.lorraine ? Math.round(a.debut - a.arrivee) + " min" : "prévue"}` : " · à l'heure";
      html = `<span class="grand">📍 ${typeDe(prochain.lieu)} · ${p.nom}</span><br>${e2.bouge ? virgule(km.toFixed(1)) + " km · " : ""}arrivée ${heureTexte(a.arrivee)}${attente}<br>${fen} · ${p.demande} unités`;
    }
  }
  if (gpsTexte.innerHTML !== html) gpsTexte.innerHTML = html;
}
function dessinerCompteur(cm) {
  const W = compteurVitesse.width, H = compteurVitesse.height, cx = W / 2, cy = H * .78, r = W * .4;
  const v = cm.etat.vit || 0, vmax = 100;
  ctxV.clearRect(0, 0, W, H);
  ctxV.lineCap = "round";
  ctxV.strokeStyle = "rgba(255,255,255,.15)"; ctxV.lineWidth = 16; ctxV.beginPath(); ctxV.arc(cx, cy, r, Math.PI, 2 * Math.PI); ctxV.stroke();
  const gr = ctxV.createLinearGradient(cx - r, 0, cx + r, 0); gr.addColorStop(0, "#2ecc71"); gr.addColorStop(.6, "#ffd23f"); gr.addColorStop(1, "#e74c3c");
  ctxV.strokeStyle = gr; ctxV.beginPath(); ctxV.arc(cx, cy, r, Math.PI, Math.PI * (1 + borne(v / vmax, 0, 1) + 1e-4)); ctxV.stroke();
  ctxV.fillStyle = "rgba(255,255,255,.6)"; ctxV.font = "18px Segoe UI"; ctxV.textAlign = "center";
  for (let k = 0; k <= 100; k += 20) { const a = Math.PI * (1 + k / vmax); ctxV.fillText(k, cx + Math.cos(a) * (r - 34), cy + Math.sin(a) * (r - 34) + 6); }
  const a = Math.PI * (1 + borne(v / vmax, 0, 1));
  ctxV.strokeStyle = "#ff5a3c"; ctxV.lineWidth = 5; ctxV.beginPath(); ctxV.moveTo(cx, cy); ctxV.lineTo(cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8)); ctxV.stroke();
  ctxV.fillStyle = "#fff"; ctxV.font = "bold 46px Segoe UI"; ctxV.fillText(Math.round(v), cx, cy - 18);
  ctxV.font = "18px Segoe UI"; ctxV.fillStyle = "rgba(255,255,255,.7)"; ctxV.fillText("km/h", cx, cy + 6);
  const reste = cm.donnees.charge - cm.donnees.arrets.filter(x => x.fin <= t).reduce((s, x) => s + L[x.client].demande, 0);
  ctxV.textAlign = "left"; ctxV.font = "16px Segoe UI"; ctxV.fillText(`🚚 ${cm.donnees.numero}`, 8, 22);
  ctxV.textAlign = "right"; ctxV.fillText(`📦 ${Math.round(reste)} / ${D.capacite}`, W - 8, 22);
  if (cm.etat.freine) { ctxV.fillStyle = "#e74c3c"; ctxV.textAlign = "center"; ctxV.fillText("● FREIN", cx, H - 4); }
}

// =====================================================================
// 10. Ciel : soleil, lune, étoiles, nuit (fenêtres, lampadaires, phares)
// =====================================================================
const dirSoleil = new THREE.Vector3(), couleurBrume = new THREE.Color();
const BRUME_JOUR = new THREE.Color("#cfdce8"), BRUME_AUBE = new THREE.Color("#e8b48a"), BRUME_NUIT = new THREE.Color("#0b1124"), BRUME_PLUIE = new THREE.Color("#8d97a3");
let nuit = 0;
function majCiel(h) {
  const a = (h - 6) / 12 * Math.PI, hauteur = Math.sin(a);
  dirSoleil.set(-Math.cos(a), hauteur, .35).normalize();
  U.sunPosition.value.copy(dirSoleil);
  U.turbidity.value = pluie ? 14 : 2.8 + 3 * (1 - borne(hauteur, 0, 1));
  U.rayleigh.value = pluie ? 3.5 : .9 + 2 * (1 - borne(hauteur * 2, 0, 1));
  nuit = borne((.1 - hauteur) / .3, 0, 1);              // aube et crépuscule : à moitié allumé
  const jour = borne(hauteur * 3, 0, 1);
  soleil.intensity = jour * (pluie ? .6 : 1.9);
  soleil.color.setRGB(1, .78 + .2 * jour, .6 + .36 * jour);
  hemi.intensity = (pluie ? .45 : .5) * (1 - nuit) + .05;
  hemi.color.setRGB(.85 - .45 * nuit, .9 - .4 * nuit, 1);
  lune.intensity = .3 * nuit;
  lune.position.set(-dirSoleil.x, Math.max(.3, -dirSoleil.y), -dirSoleil.z).multiplyScalar(TAILLE);
  rendu.toneMappingExposure = .42 + .12 * nuit;
  etoiles.material.opacity = pluie ? 0 : nuit;
  halosLune.material.opacity = pluie ? 0 : nuit * .9;
  halosLune.position.copy(lune.position).normalize().multiplyScalar(TAILLE * 3);
  // brume : couleur du ciel à l'horizon
  if (hauteur > .25) couleurBrume.copy(BRUME_JOUR);
  else if (hauteur > -.05) couleurBrume.copy(BRUME_AUBE).lerp(BRUME_JOUR, (hauteur + .05) / .3);
  else couleurBrume.copy(BRUME_NUIT).lerp(BRUME_AUBE, borne((hauteur + .25) / .2, 0, 1));
  if (pluie) couleurBrume.lerp(BRUME_PLUIE, .7 * (1 - nuit));
  scene.fog.color.copy(couleurBrume);
  scene.fog.near = pluie ? TAILLE * .15 : TAILLE * 1.2; scene.fog.far = pluie ? TAILLE * 1.6 : TAILLE * 4;
  // la nuit, tout s'allume
  materiauxNuit.forEach(m => { m.emissiveIntensity = 1.3 * nuit; });
  matAmpoule.emissiveIntensity = 2.5 * nuit;
  halosLampes.material.opacity = .9 * nuit; flaques.material.opacity = .35 * nuit;
  pharesVoitures.material.opacity = .9 * nuit;
  halosQuais.forEach(hq => { hq.material.opacity = .9 * nuit; });
  matPhare.emissiveIntensity = .3 + 2.5 * nuit;
  matNuage.opacity = .92 - .6 * nuit; matNuage.color.setScalar(pluie ? .65 : 1);
  if (Math.abs(h - heureReflets) > .3 || pluieReflets !== pluie) { heureReflets = h; pluieReflets = pluie; majReflets(); }
}
// Les ombres suivent ce que l'on regarde : nettes de près, larges de loin
function majOmbres(cx, cz, distance) {
  const S = borne(distance * .9, 35, 650), sc = soleil.shadow.camera;
  if (Math.abs(sc.right - S) > S * .08) { sc.left = -S; sc.right = S; sc.top = S; sc.bottom = -S; sc.near = 1; sc.far = S * 8; sc.updateProjectionMatrix(); }
  const pas = 2 * S / soleil.shadow.mapSize.x;                    // calé sur les pixels de l'ombre : pas de scintillement
  soleil.target.position.set(Math.round(cx / pas) * pas, 0, Math.round(cz / pas) * pas);
  soleil.position.copy(soleil.target.position).addScaledVector(v3.set(dirSoleil.x, Math.max(dirSoleil.y, .15), dirSoleil.z).normalize(), S * 3);
  lune.target.position.copy(soleil.target.position);
}

// =====================================================================
// 11. La boucle d'animation
// =====================================================================
let avant = performance.now(), dernierEvenement = -2, dernierPanneau = 0, images = 0, debutMesure = performance.now() + 5000, lent = 0;
const champHeure = document.getElementById("heure"), barreJour = document.getElementById("barreJour");
const champCompteur = document.getElementById("compteur"), champTrafic = document.getElementById("trafic"), champMeteo = document.getElementById("meteo");
const journal = document.getElementById("journal");
camera.position.set(0, TAILLE * 1.1, TAILLE * 1.1);
choisirVue(-1, false);

function image() {
  requestAnimationFrame(image);
  const maintenant = performance.now(), dt = Math.min((maintenant - avant) / 1000, .1); avant = maintenant;
  if (conteneur.clientWidth === 0) { images = 0; debutMesure = maintenant + 4000; return; }   // onglet caché : la journée attend
  // qualité automatique : si l'ordinateur peine, on allège (mesure sur 3 s, après le démarrage)
  if (maintenant > debutMesure) images++;
  if (maintenant - debutMesure > 3000) {
    const fps = images * 1000 / (maintenant - debutMesure); images = 0; debutMesure = maintenant;
    lent = fps < 24 ? lent + 1 : 0;
    if (lent >= 2 && qualite > 0) { regler(qualite - 1); lent = 0; annoncer("Qualité réduite automatiquement pour rester fluide"); }
  }
  if (lecture) {
    t += (T1 - T0) / DUREE * vitesse * dt;
    if (t >= T1) { t = T1; lecture = false; boutonLecture.textContent = "▶"; }
  }
  frise.value = Math.round(1000 * (t - T0) / Math.max(T1 - T0, 1e-9));

  champHeure.textContent = (D.lorraine ? "🕒 " : "Journée ") + heureTexte(t);
  barreJour.style.width = (100 * borne((t - D.ouverture) / (D.fermeture - D.ouverture), 0, 1)) + "%";
  const tr = coefTrafic(t);
  if (D.trafic) {
    champTrafic.style.display = "inline-block";
    champTrafic.textContent = `🚦 ${tr.nom} · ×${virgule(tr.coef)}`;
    champTrafic.style.background = tr.coef >= 1.4 ? "#c0392b" : tr.coef > 1.05 ? "#e67e22" : "#27ae60";
  }
  champMeteo.style.display = pluie ? "inline-block" : "none"; champMeteo.textContent = "🌧️ Pluie"; champMeteo.style.background = "#34627f";
  majCiel(heureLumiere(t));
  nuages.children.forEach(n => { n.position.x += n.userData.v * dt * (pluie ? 2 : 1); if (n.position.x > maxX + 200) n.position.x = minX - 200; });
  avancerVoitures(dt * (lecture ? Math.min(vitesse, 3) : 0), tr.coef);
  if (pluie) tomberPluie(dt);

  // Camions
  const clignote = (maintenant / 380 | 0) % 2 === 0;
  camions.forEach(cm => {
    const e = etatCamion(cm, t); cm.etat = e;
    const dx = e.x - cm.x, dz = e.z - cm.z, d = Math.hypot(dx, dz);
    let virage = 0;
    if (e.bouge) {
      let diff = e.cap - cm.cap; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      const pas = diff * Math.min(1, dt * 5); cm.cap += pas; virage = pas / Math.max(dt, 1e-3);
    } else if (t <= cm.passages[0].t || e.fini) cm.cap = capParking;
    cm.x = e.x; cm.z = e.z;
    cm.groupe.position.set(cm.x, 0, cm.z);
    cm.groupe.rotation.y = cm.cap;
    const sens = dx * Math.sin(cm.cap) + dz * Math.cos(cm.cap) >= 0 ? 1 : -1;
    cm.roues.forEach(r => { r.rotation.x += sens * d / .52; });
    if (cm.volant) cm.volant.rotation.z = -virage * .6;
    // feux : stop au freinage et à l'arrêt, clignotant dans les virages
    const frein = e.freine || !e.bouge;
    cm.matFrein.emissiveIntensity = frein ? 2.2 : .35 + .8 * nuit;
    cm.halosArriere.forEach(h => { h.material.opacity = frein ? .8 : .25 * nuit; });
    cm.halos.forEach(h => { h.material.opacity = .95 * nuit; });
    cm.matClignotant.emissiveIntensity = Math.abs(virage) > .35 && clignote ? 3 : 0;
    if (e.livre && posBatiment[e.livre.client]) {
      const b = posBatiment[e.livre.client], f = e.f;
      cm.colis.visible = f < .95;
      cm.colis.position.set(cm.x + (b.porteX - cm.x) * f, .45 + Math.sin(f * Math.PI) * 1.2, cm.z + (b.porteZ - cm.z) * f);
    } else cm.colis.visible = false;
  });
  if (maintenant - dernierPanneau > 150) {           // panneau des camions (pas à chaque image)
    dernierPanneau = maintenant;
    camions.forEach(cm => {
      const livres = cm.donnees.arrets.filter(a => a.fin <= t);
      const reste = cm.donnees.charge - livres.reduce((s, a) => s + L[a.client].demande, 0);
      if (cm.texte !== cm.etat.texte) { cm.divEtat.textContent = cm.etat.texte; cm.texte = cm.etat.texte; }
      cm.divLivres.textContent = `${livres.length}/${cm.donnees.arrets.length}`;
      cm.divCharge.style.width = (100 * reste / D.capacite) + "%";
    });
  }

  // Repères des clients
  let modif = false;
  for (let i = 1; i < NB; i++) {
    const info = infoClient[i]; if (!info || !posBatiment[i]) continue;
    const etat = t >= info.fin ? 2 : t >= info.arrivee ? 1 : 0;
    if (etat === 1 || etat !== etatClient[i]) {
      const b = posBatiment[i], h = b.haut + (etat === 2 ? 4.6 : 6) + (etat === 1 ? Math.sin(maintenant / 150) * .6 : 0);
      const s = etat === 2 ? .7 : etat === 1 ? 1.3 : 1;
      placer(reperes, i, b.x, h, b.z, maintenant / 600, s, s, s);
      reperes.setColorAt(i, etat === 2 ? VERT : etat === 1 ? JAUNE : couleursCamions[info.camion] || GRIS);
      etatClient[i] = etat; modif = true;
    }
  }
  if (modif) { reperes.instanceMatrix.needsUpdate = true; reperes.instanceColor.needsUpdate = true; }

  // Compteur et journal
  let a = 0, b = evenements.length;
  while (a < b) { const m = (a + b) >> 1; if (evenements[m].t <= t) a = m + 1; else b = m; }
  if (a - 1 !== dernierEvenement) {
    dernierEvenement = a - 1;
    const livres = evenements.slice(0, a).filter(e => e.livraison).length;
    champCompteur.innerHTML = `📦 Livraisons : <b>${livres}</b> / ${NB - 1}`;
    journal.innerHTML = "<b>Journal de la journée</b><br>" + (evenements.slice(Math.max(0, a - 7), a).reverse()
      .map(e => `<span style="color:${e.c}">●</span> ${heureTexte(e.t)} · ${e.texte}`).join("<br>") || "<i>La journée commence…</i>");
  }

  // Caméra
  let ox = controles.target.x, oz = controles.target.z, od = camera.position.distanceTo(controles.target);
  if (mode === "cinema") {
    filmer(dt);
    if (plan && plan.k >= 0) { ox = camions[plan.k].x; oz = camions[plan.k].z; od = 60; }
  } else if (mode === "cabine") {
    const g = camions[suivi].groupe; g.updateMatrixWorld();
    camera.position.copy(v3.set(.55, 2.72, 2.25).applyMatrix4(g.matrixWorld));
    camera.quaternion.copy(g.quaternion).multiply(qDemiTour);
    camera.rotateX(-.1);
    ox = camions[suivi].x; oz = camions[suivi].z; od = 70;
  } else if (transition > 0) {
    transition = Math.min(1, transition + dt / 1.6);
    const f = 1 - Math.pow(1 - transition, 3);
    if (mode === "suivi") cible.set(camions[suivi].x, 2, camions[suivi].z);
    camera.position.lerpVectors(departCam, arriveeCam, f);
    controles.target.lerpVectors(debutCible, cible, f);
    if (transition >= 1) transition = 0;
    controles.update();
  } else {
    if (mode === "suivi") {
      const cm = camions[suivi], ddx = cm.x - controles.target.x, ddz = cm.z - controles.target.z;
      controles.target.x += ddx; controles.target.z += ddz; camera.position.x += ddx; camera.position.z += ddz;
    }
    controles.update();
  }
  if (mode === "suivi" || mode === "cabine") { dessinerGps(camions[suivi]); dessinerCompteur(camions[suivi]); }
  majOmbres(ox, oz, od);
  majSon();

  rendu.render(scene, camera);
}
for (const m of [parcelles, commerces, toitsCommerces, terrains, ...stores, maisons, immeubles, tours, toitsMaisons, cheminees,
                 toitsPlats, clims, troncs, feuillus, coniferes, carrefours, voitures, poteaux, bras, tetes, flaques])
  { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
image();
</script>
